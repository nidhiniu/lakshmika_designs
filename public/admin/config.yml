backend:
  name: github
  repo: nidhiniu/lakshmika_designs
  branch: main
  base_url: https://friendly-gingersnap-a594db.netlify.app
  auth_endpoint: api/auth
  open_authoring: true

media_folder: "public/uploads"
public_folder: "/uploads"

site_url: "https://friendly-gingersnap-a594db.netlify.app"
display_url: "https://friendly-gingersnap-a594db.netlify.app"

collections:
  - name: "shop"
    label: "Shop Products"
    delete: false
    editor:
      preview: false
    files:
      - name: "products"
        label: "Products"
        file: "public/data/products.json"
        format: "json"
        fields:
          - label: "Products"
            name: "products"
            widget: "list"
            summary: "{{fields.name}} ({{fields.category}})"
            fields:
              - { label: "Product ID", name: "id", widget: "string" }
              - label: "Product Name"
                name: "name"
                widget: "string"
              - label: "Category"
                name: "category"
                widget: "select"
                options: ["Jewellery", "Sarees", "Dresses"]
              - { label: "Image URL", name: "image", widget: "string" }
              - { label: "Price Label", name: "priceLabel", widget: "string", required: false }
              - { label: "Show in New Arrivals", name: "isNewArrival", widget: "boolean", default: false }
              - { label: "Show in Offers / Sale", name: "isOnSale", widget: "boolean", default: false }
      - name: "site-settings"
        label: "Site Settings"
        file: "public/data/site-settings.json"
        format: "json"
        fields:
          - label: "Brand Details"
            name: "brand"
            widget: "object"
            fields:
              - { label: "Brand Name", name: "name", widget: "string" }
              - { label: "Tagline", name: "tagline", widget: "string" }
              - { label: "WhatsApp Number (country code + number)", name: "whatsappNumber", widget: "string" }
              - { label: "Instagram Handle (without @)", name: "instagramHandle", widget: "string" }
              - { label: "Email", name: "email", widget: "string", required: false }
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Badge Text", name: "badge", widget: "string" }
              - { label: "Headline Line 1", name: "headline1", widget: "string" }
              - { label: "Headline Line 2", name: "headline2", widget: "string" }
              - { label: "Subtext", name: "subtext", widget: "text" }
              - { label: "Background Image URL", name: "backgroundImage", widget: "string" }
          - label: "Story Section"
            name: "story"
            widget: "object"
            fields:
              - { label: "Title Line 1", name: "title1", widget: "string" }
              - { label: "Title Line 2", name: "title2", widget: "string" }
              - { label: "Story Body", name: "body", widget: "text" }
              - { label: "Story Image URL", name: "image", widget: "string" }
              - { label: "Story Image Alt Text", name: "imageAlt", widget: "string" }
          - label: "About Us Content"
            name: "about"
            widget: "object"
            fields:
              - { label: "About Intro", name: "intro", widget: "text" }
              - { label: "About Main Body", name: "body", widget: "text" }
              - { label: "About Closing Text", name: "outro", widget: "text" }
