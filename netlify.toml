[build]
  command   = "npm run build"
  publish   = "dist"

[[redirects]]
  from   = "/api/auth"
  to     = "/.netlify/functions/decap-auth"
  status = 200

[[redirects]]
  from   = "/api/callback"
  to     = "/.netlify/functions/decap-auth"
  status = 200

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
